name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.event_name == 'push' && 'master-release' || github.run_id }}
  queue: max

permissions:
  contents: read

jobs:
  test:
    env:
      RELEASE_BUILD: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build Windows release binaries
        if: env.RELEASE_BUILD == 'true' && runner.os == 'Windows'
        run: cargo build --release --locked -p sdo-arrowgene -p sdo-server --bin sdo-arrowgene --bin sdo-server
      - name: Build universal macOS binaries
        if: env.RELEASE_BUILD == 'true' && runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p sdo-arrowgene -p sdo-server --bin sdo-arrowgene --bin sdo-server --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p target/release
          for binary in sdo-arrowgene sdo-server; do
            lipo -create "target/aarch64-apple-darwin/release/$binary" "target/x86_64-apple-darwin/release/$binary" -output "target/release/$binary"
            codesign --force --sign - "target/release/$binary"
            lipo "target/release/$binary" -verify_arch arm64 x86_64
            codesign --verify --all-architectures "target/release/$binary"
          done
      - name: Package macOS binaries
        if: env.RELEASE_BUILD == 'true' && runner.os == 'macOS'
        run: |
          mkdir -p target/dist
          tar -czf target/dist/sdo-macos-universal.tar.gz -C target/release sdo-arrowgene sdo-server
      - name: Package Windows binaries
        if: env.RELEASE_BUILD == 'true' && runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force target/dist
          Compress-Archive -LiteralPath target/release/sdo-arrowgene.exe,target/release/sdo-server.exe -DestinationPath target/dist/sdo-windows-x86_64.zip -Force
      - name: Upload release archive
        if: env.RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: app/target/dist/sdo-*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check glibc baseline and install ALSA headers
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Check and build Linux binaries
        working-directory: app
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked -p sdo-arrowgene -p sdo-server --bin sdo-arrowgene --bin sdo-server
      - name: Check required glibc versions and package Linux binaries
        shell: bash
        run: |
          for binary in sdo-arrowgene sdo-server; do
            required=$(readelf --version-info "app/target/release/$binary" | grep -oE 'Name: GLIBC_[0-9.]+' | cut -d_ -f2 | sort -V | tail -n 1)
            echo "$binary requires GLIBC_$required"
            test -n "$required"
            dpkg --compare-versions "$required" le 2.35
          done
          mkdir -p dist image-binaries/amd64
          cp app/target/release/sdo-server image-binaries/amd64/
          tar -czf dist/sdo-linux-x86_64.tar.gz -C app/target/release sdo-arrowgene sdo-server
      - name: Smoke-test the archive on a clean Ubuntu 22.04 image
        run: |
          docker run --rm -i -v "$PWD/dist:/dist:ro" -w /tmp ubuntu:22.04 bash -eu <<'SMOKE'
          apt-get update -qq
          apt-get install -y --no-install-recommends libasound2
          tar -xzf /dist/sdo-linux-x86_64.tar.gz
          ./sdo-arrowgene --help
          ./sdo-server 127.0.0.1:32100 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          timeout 10 bash -c 'until (echo > /dev/tcp/127.0.0.1/32100) 2>/dev/null; do sleep 0.1; done'
          SMOKE
      - uses: docker/setup-buildx-action@v4
      - name: Check standalone Wolfi server image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: server-binaries=./image-binaries
          platforms: linux/amd64
          load: true
          tags: sdo-server:ci
          cache-from: |
            type=gha,scope=sdo-server-amd64
            type=gha,scope=sdo-server
          cache-to: type=gha,scope=sdo-server-amd64,mode=max
      - name: Start standalone server as its default user
        shell: bash
        run: |
          container=$(docker run --detach --publish 127.0.0.1::32100 sdo-server:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          endpoint=$(docker port "$container" 32100/tcp)
          timeout 10 bash -c 'until (echo > "/dev/tcp/127.0.0.1/$1") 2>/dev/null; do sleep 0.1; done' _ "${endpoint##*:}"
      - name: Upload tested Linux archive
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-Linux
          path: dist/sdo-linux-x86_64.tar.gz
          if-no-files-found: error

  server-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build and check native arm64 server
        working-directory: app
        run: |
          cargo build --release --locked -p sdo-server --bin sdo-server
          target/release/sdo-server --help
          tar -czf "$RUNNER_TEMP/server-arm64.tar.gz" -C target/release sdo-server
      - uses: actions/upload-artifact@v7
        with:
          name: server-linux-arm64
          path: ${{ runner.temp }}/server-arm64.tar.gz
          if-no-files-found: error

  release:
    needs: [test, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Tag the tested commit
        id: version
        run: |
          latest_version() {
            git tag --sort=version:refname "$@" | sed -nE '/^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$/p' | tail -n 1
          }
          tag=$(latest_version --points-at "$GITHUB_SHA")
          if [[ -z "$tag" ]]; then
            latest=$(latest_version)
            if [[ -z "$latest" ]]; then
              tag=v$(python3 -c 'import tomllib; print(tomllib.load(open("app/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
            else
              tag="${latest%.*}.$(( ${latest##*.} + 1 ))"
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish release with all three archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          archives=(dist/sdo-linux-x86_64.tar.gz dist/sdo-macos-universal.tar.gz dist/sdo-windows-x86_64.zip)
          for archive in "${archives[@]}"; do test -s "$archive"; done
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "$TAG"
            draft=true
          fi
          if [[ $draft == true ]]; then
            gh release upload "$TAG" "${archives[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            published=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for archive in "${archives[@]}"; do
              grep -Fxq "${archive##*/}" <<< "$published" || { echo "Missing release asset: $archive" >&2; exit 1; }
            done
          fi

  publish-image:
    needs: [release, server-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-Linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: server-linux-arm64
          path: dist
      - name: Prepare server binaries for the image
        run: |
          mkdir -p image-binaries/{amd64,arm64}
          tar -xzf dist/sdo-linux-x86_64.tar.gz -C image-binaries/amd64 sdo-server
          tar -xzf dist/server-arm64.tar.gz -C image-binaries/arm64 sdo-server
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select server image tags
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sdo-server"
          tags=("$image:$RELEASE_TAG")
          latest_release=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest_release" == "$RELEASE_TAG" ]]; then
            tags+=("$image:latest")
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish standalone server
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: server-binaries=./image-binaries
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
          cache-from: |
            type=gha,scope=sdo-server-amd64
            type=gha,scope=sdo-server
          cache-to: type=gha,scope=sdo-server,mode=max
