[package]
name = "sdo-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
sdo-net.workspace = true
serde.workspace = true
sha2.workspace = true
url = "2"
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mio = {version="1.2.4",features=["os-poll","net"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["BinaryType", "MessageEvent", "WebSocket", "Window","Storage","Location","AudioContext","AudioContextState","AudioDestinationNode","AudioBuffer","AudioBufferSourceNode","AudioNode","AudioScheduledSourceNode", "Blob", "Cache", "CacheStorage", "Headers", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "RequestInit", "RequestCache", "RequestCredentials", "Response", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult"] }

[dev-dependencies]
serde_json.workspace = true
