[package]
name = "sdo-asset-loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sdo-platform.workspace = true
anyhow.workspace = true
sdo-assets.workspace = true
sdo-audio.workspace = true
sdo-dance.workspace = true
sdo-song = {workspace=true, features=["catalog"]}
serde.workspace = true
serde_json.workspace = true
font8x8 = "0.3.1"

sha2.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
directories = "6"
tempfile = "3.27"

[dev-dependencies]
image.workspace = true
sdo-ui.workspace = true
sdo-gameplay.workspace = true

