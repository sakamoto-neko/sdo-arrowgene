<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDO Arrowgene</title>
  <link rel="stylesheet" href="./player.css">
  <style>
    #game { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
    #launcher { max-width: 36rem; margin: 10vh auto; padding: 2rem; }
    #launcher form { margin: 2rem 0; }
  </style>
</head>
<body>
  <section id="launcher">
    <h1>SDO Arrowgene</h1>
    <form id="source"><label for="endpoint">Asset server</label><div class="address">
      <input id="endpoint" type="url" required placeholder="Asset server URL"><button>Load game</button>
    </div></form>
    <p id="status" role="status">Connect a collection to play.</p>
  </section>
  <canvas id="game" tabindex="0" aria-label="SDO Arrowgene game" hidden></canvas>
  <script type="module" src="./client.mjs"></script>
</body>
</html>
